name: Update radar and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"      # every day ~06:17 UTC: job & PhD feeds
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile opportunities from feeds
        if: github.event_name != 'push' || hashFiles('data/opportunities.json') == ''
        run: python scripts/update_radar.py
        continue-on-error: true

      - name: Refresh sponsor register (Mondays, manual runs, or if missing)
        if: github.event_name != 'push' || hashFiles('data/sponsors.json') == ''
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ] && [ -s data/sponsors.json ]; then
            echo "Not Monday — keeping last week's register"; exit 0
          fi
          python scripts/update_sponsors.py
        continue-on-error: true

      - name: Find researchers in her field (OpenAlex)
        if: github.event_name != 'push' || hashFiles('data/people.json') == ''
        run: python scripts/update_people.py
        continue-on-error: true

      - name: Save data back to the repo
        run: |
          git config user.name "cornelieur-robot"
          git config user.email "cornelieur-robot@users.noreply.github.com"
          for f in data/opportunities.json data/sponsors.json data/people.json; do [ -f "$f" ] && git add "$f"; done; true
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "Radar update $(date -u +%F)" && git push; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
